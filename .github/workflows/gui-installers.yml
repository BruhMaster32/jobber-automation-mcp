name: GUI installer bundles

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build cross-platform bundles
        run: bash scripts/package-installers.sh jobber-automation-mcp "${GITHUB_REF_NAME:-manual}"
      - uses: actions/upload-artifact@v4
        with:
          name: jobber-automation-mcp-gui-installers
          path: dist/*
      - name: Attach bundles to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber

